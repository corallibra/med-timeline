<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="中西医发展对照时间轴 — 不对称双轴时间线" />
  <title>中西医发展对照时间轴</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <h1 class="site-title" id="site-title">中西医发展对照时间轴</h1>
      <p class="site-subtitle" id="site-subtitle"></p>
      <div class="filters" role="search" aria-label="筛选">
        <div class="toolbar-row" id="toolbar-row">
          <div class="filter-group side-filters" role="group" aria-label="侧别">
            <button type="button" class="filter-btn active" data-side="all">全部</button>
            <button type="button" class="filter-btn west" data-side="west">西方医学</button>
            <button type="button" class="filter-btn east" data-side="east">中国传统医学</button>
          </div>
          <div class="search-wrap">
            <input type="search" id="filter-search" placeholder="搜索标题、摘要、人物…" autocomplete="off" />
          </div>
          <div class="filter-popover-wrap" id="filter-popover-wrap">
            <button type="button" class="filter-popover-btn" id="filter-popover-btn"
              aria-expanded="false" aria-controls="filter-popover" aria-haspopup="true">
              <span>筛选</span>
              <span class="filter-active-badge" id="filter-badge" hidden aria-hidden="true">0</span>
              <span class="chevron" aria-hidden="true">▾</span>
            </button>
            <div class="filter-popover" id="filter-popover" hidden role="dialog" aria-label="高级筛选">
              <label class="filter-check">
                <input type="checkbox" id="draft-archaeology" />
                <span>仅考古证据</span>
              </label>
              <div class="tag-filters-label">标签</div>
              <div class="tag-filters" id="tag-filters"></div>
              <div class="popover-actions">
                <button type="button" class="btn-clear" id="filter-clear">清除</button>
                <button type="button" class="btn-confirm" id="filter-confirm">确定</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="timeline-main">
    <div class="legend" aria-hidden="true">
      <span class="legend-west">西方医学</span>
      <span class="legend-axis">时间轴</span>
      <span class="legend-east">中国传统医学</span>
    </div>

    <div class="timeline-viewport" id="timeline-viewport">
      <div class="timeline-track" id="timeline-track">
        <div class="axis" id="axis" aria-hidden="true">
          <div class="axis-line"></div>
          <div class="year-ruler" id="year-ruler"></div>
        </div>
        <div class="events-layer" id="events-layer"></div>
      </div>
    </div>

    <p class="empty-state" id="empty-state" hidden>没有符合条件的事件。</p>
    <p class="load-error" id="load-error" hidden>无法加载时间轴数据，请检查 data/timeline.json。</p>
  </main>

  <aside class="detail-panel" id="detail-panel" aria-hidden="true" role="dialog" aria-labelledby="detail-title">
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <div class="detail-sheet">
      <button type="button" class="detail-close" id="detail-close" aria-label="关闭">×</button>
      <div class="detail-side-badge" id="detail-side"></div>
      <p class="detail-year" id="detail-year"></p>
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="detail-summary" id="detail-summary"></p>
      <section class="detail-section" id="detail-people-sec" hidden>
        <h3>相关人物</h3>
        <ul id="detail-people"></ul>
      </section>
      <section class="detail-section" id="detail-works-sec" hidden>
        <h3>相关著作</h3>
        <ul id="detail-works"></ul>
      </section>
      <section class="detail-section" id="detail-tags-sec" hidden>
        <h3>标签</h3>
        <div class="chips" id="detail-tags"></div>
      </section>
      <section class="detail-section" id="detail-sources-sec" hidden>
        <h3>来源</h3>
        <ul id="detail-sources"></ul>
      </section>
      <p class="detail-meta" id="detail-meta"></p>
    </div>
  </aside>

  <footer class="site-footer">
    <p class="copyright">Copyright © 2026 Li Yuxian TCM Studio. All Rights Reserved.</p>
    <span id="footer-meta" class="footer-meta"></span>
  </footer>

  <script src="./js/app.js" defer></script>
</body>
</html>
