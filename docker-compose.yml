# Synology Container Manager / Docker Compose
# 默认访问：http://<主机>:${MED_TIMELINE_PORT:-3007}
# data/ 只读挂载：改 timeline.json 后刷新浏览器即可，不必重建镜像。
# 下面的变量只给 Compose 插值用，应用进程读不到它们。
# 不使用命名卷：时间轴数据是宿主机上的普通 JSON 文件，方便直接编辑和备份。

services:
  med-timeline:
    image: "med-timeline:${MED_TIMELINE_VERSION:-1.3.0}"
    # 本仓库不发布镜像。始终在本地构建，避免 compose up 时按这个名字去 Docker Hub 拉取。
    pull_policy: build
    build:
      context: .
      args:
        VERSION: "${MED_TIMELINE_VERSION:-1.3.0}"
    container_name: med-timeline
    ports:
      - "${MED_TIMELINE_PORT:-3007}:80"
    volumes:
      - ./data:/usr/share/nginx/html/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
